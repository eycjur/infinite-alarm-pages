name: 不具合報告 / Bug Report
description: アプリの不具合を報告する / Report a bug in the app
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。分かる範囲で記入してください。
        **このページの投稿内容は誰でも閲覧できます。** 診断情報のアラームラベル名は自動的に伏せ字になりますが、個人的な内容が含まれていないかご確認のうえ投稿してください。

        Thank you for your report. Please fill in what you can.
        **Everything posted here is publicly visible.** Alarm label names in the diagnostics are automatically redacted, but please review the content for anything personal before submitting.
  - type: textarea
    id: description
    attributes:
      label: 不具合の内容 / What happened
      description: 何が起きたか、期待していた動作との違いを書いてください / Describe what happened and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOSバージョン / iOS version
      description: アプリ内「このアプリについて」画面に表示されます / Shown in the app's About screen
      placeholder: iOS 26.1
  - type: input
    id: device
    attributes:
      label: 機種 / Device
      placeholder: iPhone 16e
  - type: input
    id: app-version
    attributes:
      label: アプリのバージョン / App version
      description: アプリ内「このアプリについて」画面に表示されます / Shown in the app's About screen
      placeholder: "1.0"
  - type: textarea
    id: diagnostics
    attributes:
      label: 診断情報 / Diagnostics
      description: アプリの「このアプリについて」→「診断情報を書き出す」で保存したファイルを、この欄に添付してください（欄をタップしてファイルを選択、またはドラッグ＆ドロップ） / Attach the file saved via "Export Diagnostics" in the app's About screen (tap the field to select the file, or drag and drop)
