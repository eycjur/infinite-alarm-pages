<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無限アラーム / Infinite Alarm</title>
<script>
  // ブラウザの言語設定で日本語版・英語版へ振り分ける
  location.replace((navigator.language || "").toLowerCase().startsWith("ja") ? "ja/" : "en/");
</script>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; line-height: 1.8; }
  a { color: #3478F6; }
</style>
</head>
<body>
<noscript>
  <p><a href="ja/">日本語</a> / <a href="en/">English</a></p>
</noscript>
</body>
</html>
